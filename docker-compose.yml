# Everything in one command:  docker compose up --build   → the app on http://localhost:3000
# Tests:                      docker compose run --rm test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: create-test-database
        target: /docker-entrypoint-initdb.d/create-test-database.sql
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The API, the web app and the reminder worker, all from the one Dockerfile.
  app:
    build: .
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/booking
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me} # demo value; use a real secret in production
      SIGNUPS_PER_HOUR: "500" # local only, so repeated e2e runs don't hit the sign-up limit (default 20)
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "3000:4000"
    restart: unless-stopped

  # The backend tests, against their own database:  docker compose run --rm test
  test:
    build: { context: ., target: test }
    environment:
      TEST_DATABASE_URL: postgres://booking:booking@db:5432/booking_test
    depends_on:
      db: { condition: service_healthy }
    profiles: ["test"]

configs:
  # Runs once, when the database volume is first created.
  create-test-database:
    content: |
      -- A separate database for the test suite, so tests never touch the app's data.
      CREATE DATABASE booking_test;

volumes:
  pgdata:
