# Render Blueprint: deploys the whole app on Render's free plan.
#   thought     one web service: API + web app + reminder worker (built from ./Dockerfile)
#   thought-db  Postgres
# In Render: New > Blueprint > pick this repository. JWT_SECRET is generated by Render.
# Free plan notes: the service sleeps after 15 minutes without visitors (first request then takes
# about a minute, and reminders due while asleep are delivered when it wakes), and the free
# database is deleted after 30 days unless upgraded.

services:
  - type: web
    name: thought
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thought-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: thought-db
    plan: free
    databaseName: thought
    user: thought
    postgresMajorVersion: "17"
