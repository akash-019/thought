# Render Blueprint: New > Blueprint > pick this repo.
# One free web service built from the root Dockerfile. With no DATABASE_URL, start.sh runs a
# Postgres inside the same container. JWT_SECRET is generated by Render.
services:
  - type: web
    name: thought
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET
        generateValue: true
    # Free plan has no persistent disk: data lives until the instance restarts or redeploys,
    # then the demo accounts are re-seeded. For durable data, use a paid plan and uncomment the
    # disk below (the database already keeps its files in /data).
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
